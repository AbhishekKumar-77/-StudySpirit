<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudySpirit Browser</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a0a1a 0%, #0d1a2e 40%, #0a0a1a 100%);
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      border-radius: 20px;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      position: relative;
    }

    /* Ambient glow blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(124,58,237,0.25), transparent);
      top: -80px; left: -80px;
    }
    .blob-2 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(37,99,235,0.2), transparent);
      bottom: -60px; right: -60px;
    }
    .blob-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(245,158,11,0.1), transparent);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center;
    }

    /* Logo container */
    .logo-wrap {
      position: relative;
      width: 110px; height: 110px;
      margin-bottom: 22px;
    }

    .logo-ring {
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, #7c3aed, #2563eb, #7c3aed) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spin 4s linear infinite;
    }

    .logo-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255,255,255,0.05);
      box-shadow:
        0 0 0 1px rgba(124,58,237,0.3),
        0 0 40px rgba(124,58,237,0.3),
        0 0 80px rgba(37,99,235,0.15);
      animation: pulse 2.5s ease-in-out infinite;
    }

    /* Secure badge on logo */
    .secure-dot {
      position: absolute;
      bottom: 4px; right: 4px;
      width: 22px; height: 22px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      border: 2px solid #0a0a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }

    h1 {
      font-size: 26px; font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #e2d9f3, #bfdbfe, #e2d9f3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 32px;
    }

    /* Status text */
    .status {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 14px;
      min-height: 20px;
      font-weight: 500;
      transition: opacity 0.3s;
    }

    /* Progress bar */
    .bar-wrap {
      width: 260px; height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px; overflow: hidden;
      margin-bottom: 28px;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #2563eb, #06b6d4);
      background-size: 200% auto;
      border-radius: 99px;
      animation: progress 3.5s ease-in-out forwards, shimmer 2s linear infinite;
    }

    /* Security badges */
    .badges {
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: center; max-width: 340px;
    }
    .badge {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 99px;
      font-size: 11px; color: rgba(255,255,255,0.4);
      font-weight: 600;
    }
    .badge .dot {
      width: 5px; height: 5px;
      border-radius: 50%; background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    /* Version */
    .version {
      position: absolute;
      bottom: 16px; right: 20px;
      font-size: 10px;
      color: rgba(255,255,255,0.18);
      font-weight: 600;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(124,58,237,0.3), 0 0 40px rgba(124,58,237,0.3); }
      50%       { box-shadow: 0 0 0 1px rgba(124,58,237,0.5), 0 0 60px rgba(124,58,237,0.5), 0 0 100px rgba(37,99,235,0.2); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    @keyframes progress {
      0%   { width: 0%; }
      20%  { width: 25%; }
      50%  { width: 60%; }
      80%  { width: 85%; }
      100% { width: 100%; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .content { animation: fadeIn 0.5s ease-out; }
  </style>
</head>
<body>
  <!-- Ambient blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="content">
    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img
        class="logo-img"
        src="./assets/icon.png"
        alt="StudySpirit"
        onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='flex'"
      />
      <!-- Fallback SVG shield if image fails -->
      <div id="fallback-icon" style="display:none;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#2563eb);align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="white">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
      </div>
      <div class="secure-dot">🔒</div>
    </div>

    <h1>StudySpirit Browser</h1>
    <p class="tagline">Secure Exam Environment</p>

    <div class="status" id="status">Initializing secure session...</div>

    <div class="bar-wrap">
      <div class="bar-fill"></div>
    </div>

    <div class="badges">
      <div class="badge"><div class="dot"></div> VM Detection</div>
      <div class="badge"><div class="dot"></div> App Integrity</div>
      <div class="badge"><div class="dot"></div> Device Fingerprint</div>
      <div class="badge"><div class="dot"></div> Secure Network</div>
    </div>
  </div>

  <div class="version">v1.0.0</div>

  <script>
    const messages = [
      'Verifying app integrity...',
      'Checking for virtual machines...',
      'Generating device fingerprint...',
      'Scanning for restricted software...',
      'Establishing secure connection...',
      'Loading StudySpirit...'
    ];
    let i = 0;
    const el = document.getElementById('status');

    // Animate through status messages
    const interval = setInterval(() => {
      el.style.opacity = '0';
      setTimeout(() => {
        i = (i + 1) % messages.length;
        el.textContent = messages[i];
        el.style.opacity = '1';
      }, 200);
    }, 580);
  </script>
</body>
</html>
